<!DOCTYPE html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Auto-Fill Registration</title>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .form-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background-color: #0d1117;
      color: #c9d1d9;
      font-size: 14px;
      box-sizing: border-box;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.3);
    }

    .avatar-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .avatar-preview img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #30363d;
      display: none;
    }

    .status-msg {
      font-size: 12px;
      margin-top: 4px;
    }
    .status-msg.error { color: #f85149; }
    .status-msg.success { color: #3fb950; }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>User Registration</h2>
    
    <!-- GitHub Username Search Input -->
    <div class="form-group">
      <label for="githubUsername">GitHub Username</label>
      <input type="text" id="githubUsername" placeholder="e.g. octocat">
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- Auto-populated Name Input -->
    <div class="form-group">
      <label for="fullName">Name</label>
      <input type="text" id="fullName" placeholder="Full name will populate here...">
    </div>

    <!-- Optional Avatar Display -->
    <div class="avatar-preview">
      <img id="userAvatar" src="" alt="GitHub User Avatar">
      <span id="userBio" style="font-size: 12px; color: #8b949e;"></span>
    </div>
  </div>

  <script>
    const usernameInput = document.getElementById('githubUsername');
    const nameInput = document.getElementById('fullName');
    const avatarImg = document.getElementById('userAvatar');
    const bioText = document.getElementById('userBio');
    const statusMsg = document.getElementById('statusMsg');

    let debounceTimer;

    // Debounce listener to avoid hitting GitHub API rate limits on every keypress
    usernameInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const username = usernameInput.value.trim();

      if (!username) {
        resetForm();
        return;
      }

      debounceTimer = setTimeout(() => {
        fetchGitHubUserData(username);
      }, 500); // Waits 500ms after user stops typing
    });

    async function fetchGitHubUserData(username) {
      statusMsg.textContent = 'Fetching GitHub data...';
      statusMsg.className = 'status-msg';

      try {
        const response = await fetch(`https://api.github.com/users/${username}`);
        
        if (!response.ok) {
          throw new Error('User not found');
        }

        const data = await response.json();

        // Populate fields
        // Fallback to login handle if full name isn't set on their GitHub profile
        nameInput.value = data.name || data.login; 
        
        if (data.avatar_url) {
          avatarImg.src = data.avatar_url;
          avatarImg.style.display = 'block';
        }

        if (data.bio) {
          bioText.textContent = data.bio;
        }

        statusMsg.textContent = 'Data pulled successfully!';
        statusMsg.className = 'status-msg success';

      } catch (err) {
        statusMsg.textContent = 'GitHub user not found.';
        statusMsg.className = 'status-msg error';
        avatarImg.style.display = 'none';
        bioText.textContent = '';
      }
    }

    function resetForm() {
      nameInput.value = '';
      avatarImg.style.display = 'none';
      bioText.textContent = '';
      statusMsg.textContent = '';
    }
  </script>

</body>
</html>
